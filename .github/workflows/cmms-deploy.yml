
name: CMMS Laravel - Staging Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      approve_migrations:
        description: "Approve database backup and execution of new migrations"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cmms-staging-deployment
  cancel-in-progress: false

jobs:

  # ==========================================================
  # JOB 1: PREFLIGHT AND CHANGE INSPECTION
  # ==========================================================

  preflight:
    name: Inspect EC2 and incoming changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect server and GitHub changes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CMMS_EC2_HOST }}
          username: ${{ secrets.CMMS_EC2_USER }}
          key: ${{ secrets.CMMS_EC2_SSH_KEY }}
          fingerprint: ${{ secrets.CMMS_EC2_HOST_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 5m

          script: |
            set -Eeuo pipefail

            APP="/var/www/CMMS_Laravel"

            cd "$APP"

            echo "========== 1. SERVER IDENTITY =========="
            hostname
            whoami
            pwd

            echo
            echo "========== 2. BRANCH VALIDATION =========="

            test "$(git branch --show-current)" = "main"

            echo "Branch: main"

            echo
            echo "========== 3. LOCAL TRACKED FILE CHECK =========="

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Tracked local changes detected."
              git status --short
              exit 1
            fi

            echo "Tracked files are clean."
            echo "Untracked files will be preserved."

            echo
            echo "========== 4. FETCH GITHUB =========="

            git fetch origin main

            CURRENT="$(git rev-parse HEAD)"
            TARGET="$(git rev-parse origin/main)"

            echo "EC2 commit: $CURRENT"
            echo "GitHub commit: $TARGET"

            if [ "$CURRENT" = "$TARGET" ]; then
              echo "No new commits found."
              exit 0
            fi

            echo
            echo "========== 5. INCOMING COMMITS =========="

            git log --oneline "$CURRENT..$TARGET"

            echo
            echo "========== 6. INCOMING FILE CHANGES =========="

            git diff --name-status "$CURRENT" "$TARGET"

            echo
            echo "========== 7. MIGRATION CHANGES =========="

            MIGRATIONS="$(git diff --name-status "$CURRENT" "$TARGET" -- database/migrations)"

            if [ -n "$MIGRATIONS" ]; then
              echo "$MIGRATIONS"

              echo
              echo "Migration source changes:"
              git diff --no-ext-diff --unified=5 "$CURRENT" "$TARGET" -- database/migrations
            else
              echo "No migration files changed."
            fi

            echo
            echo "========== 8. CURRENT MIGRATION STATUS =========="

            STATUS="$(php artisan migrate:status --no-ansi)"
            echo "$STATUS"

            if grep -q "Pending" <<< "$STATUS"; then
              echo "ERROR: Existing pending migrations detected."
              exit 1
            fi

            echo
            echo "PREFLIGHT COMPLETED."

  # ==========================================================
  # JOB 2: DEPLOYMENT
  # ==========================================================

  deploy:
    name: Deploy to CMMS staging EC2
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Deploy Laravel application
        uses: appleboy/ssh-action@v1.2.2

        env:
          APPROVE_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.approve_migrations == 'true' && 'true' || 'false' }}

        with:
          host: ${{ secrets.CMMS_EC2_HOST }}
          username: ${{ secrets.CMMS_EC2_USER }}
          key: ${{ secrets.CMMS_EC2_SSH_KEY }}
          fingerprint: ${{ secrets.CMMS_EC2_HOST_FINGERPRINT }}
          port: 22
          timeout: 30s
          command_timeout: 25m
          envs: APPROVE_MIGRATIONS

          script: |
            set -Eeuo pipefail
            umask 077

            APP="/var/www/CMMS_Laravel"
            BACKUP_DIR="/home/ubuntu/db-backups"
            BRANCH="main"
            APP_URL="https://cmms.plant.stagingproduct.in"

            cd "$APP"

            echo "========== 1. SERVER VALIDATION =========="

            test "$(whoami)" = "ubuntu"
            test "$(git branch --show-current)" = "$BRANCH"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Tracked local changes detected."
              git status --short
              exit 1
            fi

            echo "Server validation passed."

            echo
            echo "========== 2. FETCH GITHUB =========="

            git fetch origin "$BRANCH"

            CURRENT="$(git rev-parse HEAD)"
            TARGET="$(git rev-parse "origin/$BRANCH")"

            echo "Current EC2 commit: $CURRENT"
            echo "Target GitHub commit: $TARGET"

            if [ "$CURRENT" = "$TARGET" ]; then
              echo "No new commits. Nothing to deploy."
              exit 0
            fi

            echo
            echo "========== 3. INSPECT MIGRATION CHANGES =========="

            MIGRATION_DIFF="$(git diff --name-status "$CURRENT" "$TARGET" -- database/migrations)"

            HAS_NEW_MIGRATIONS=false

            if [ -n "$MIGRATION_DIFF" ]; then

              echo "$MIGRATION_DIFF"

              # Only newly added migration files are allowed.
              # Existing migration modifications/deletions/renames
              # must be handled separately.

              if printf '%s\n' "$MIGRATION_DIFF" | awk 'NF && $1 != "A" {bad=1} END {exit bad ? 0 : 1}'; then
                echo "ERROR: Existing migration modified, renamed or deleted."
                echo "Create a new migration instead."
                exit 1
              fi

              HAS_NEW_MIGRATIONS=true

              if [ "${APPROVE_MIGRATIONS:-false}" != "true" ]; then
                echo "ERROR: New migration files detected."
                echo "Review the migration source."
                echo "Manually run this workflow with approve_migrations=true."
                exit 1
              fi

              echo "Migration approval received."

            else

              echo "No migration files changed."

            fi

            echo
            echo "========== 4. VERIFY CURRENT MIGRATION STATUS =========="

            CURRENT_STATUS="$(php artisan migrate:status --no-ansi)"
            echo "$CURRENT_STATUS"

            if grep -q "Pending" <<< "$CURRENT_STATUS"; then
              echo "ERROR: Existing pending migrations detected."
              exit 1
            fi

            echo
            echo "========== 5. DATABASE BACKUP =========="

            if [ "$HAS_NEW_MIGRATIONS" = "true" ]; then

              command -v mysqldump >/dev/null
              command -v gzip >/dev/null

              mkdir -p "$BACKUP_DIR"

              php <<'PHP'
            <?php

            require 'vendor/autoload.php';

            $app = require 'bootstrap/app.php';

            $app->make(
                Illuminate\Contracts\Console\Kernel::class
            )->bootstrap();

            $connection = config('database.connections.mysql');

            if (($connection['driver'] ?? '') !== 'mysql') {
                fwrite(STDERR, "Expected MySQL connection.\n");
                exit(1);
            }

            if (($connection['database'] ?? '') !== 'plant_cmms') {
                fwrite(STDERR, "Unexpected database name. Backup aborted.\n");
                exit(1);
            }

            $directory = '/home/ubuntu/db-backups';

            if (!is_dir($directory) && !mkdir($directory, 0700, true)) {
                fwrite(STDERR, "Cannot create backup directory.\n");
                exit(1);
            }

            $filename = $directory . '/plant_cmms_' .
                date('Ymd_His') . '_' . getmypid() . '.sql.gz';

            $optionFile = tempnam(sys_get_temp_dir(), 'cmms-mysql-');

            if ($optionFile === false) {
                fwrite(STDERR, "Cannot create MySQL option file.\n");
                exit(1);
            }

            $quote = static function ($value): string {
                $value = (string) $value;

                $value = str_replace(
                    ["\\", '"', "\n", "\r"],
                    ["\\\\", '\\"', '\\n', '\\r'],
                    $value
                );

                return '"' . $value . '"';
            };

            $options =
                "[client]\n" .
                "host=" . $quote($connection['host'] ?? '127.0.0.1') . "\n" .
                "port=" . (int) ($connection['port'] ?? 3306) . "\n" .
                "user=" . $quote($connection['username'] ?? '') . "\n" .
                "password=" . $quote($connection['password'] ?? '') . "\n";

            file_put_contents($optionFile, $options);
            chmod($optionFile, 0600);

            $command =
                'mysqldump --defaults-extra-file=' .
                escapeshellarg($optionFile) .
                ' --single-transaction --routines --triggers --databases ' .
                escapeshellarg($connection['database']) .
                ' | gzip -c > ' . escapeshellarg($filename);

            exec(
                'bash -o pipefail -c ' . escapeshellarg($command),
                $output,
                $status
            );

            unlink($optionFile);

            if ($status !== 0 || !is_file($filename) || filesize($filename) === 0) {
                @unlink($filename);
                fwrite(STDERR, "Database backup failed.\n");
                exit(1);
            }

            exec(
                'gzip -t ' . escapeshellarg($filename),
                $checkOutput,
                $checkStatus
            );

            if ($checkStatus !== 0) {
                @unlink($filename);
                fwrite(STDERR, "Backup integrity check failed.\n");
                exit(1);
            }

            echo "Database backup created: {$filename}\n";
            echo "Backup size: " . filesize($filename) . " bytes\n";

            exec(
                'sha256sum ' . escapeshellarg($filename),
                $hashOutput,
                $hashStatus
            );

            if ($hashStatus !== 0) {
                fwrite(STDERR, "Checksum calculation failed.\n");
                exit(1);
            }

            echo implode("\n", $hashOutput) . "\n";

            PHP

            else

              echo "No new migrations. Database backup not required for code-only deployment."

            fi

            echo
            echo "========== 6. FAST-FORWARD DEPLOYMENT =========="

            git merge --ff-only "$TARGET"

            echo
            echo "========== 7. COMPOSER INSTALL =========="

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            echo
            echo "========== 8. PHP SYNTAX VALIDATION =========="

            while IFS= read -r FILE; do

              if [[ "$FILE" == *.php && -f "$FILE" ]]; then
                echo "Checking: $FILE"
                php -l "$FILE"
              fi

            done < <(git diff --name-only "$CURRENT" "$TARGET" -- '*.php')

            echo
            echo "========== 9. CLEAR LARAVEL CACHES =========="

            php artisan optimize:clear

            echo
            echo "========== 10. DATABASE MIGRATIONS =========="

            if [ "$HAS_NEW_MIGRATIONS" = "true" ]; then

              echo "Executing approved migrations..."
              php artisan migrate --force

            else

              echo "No new migrations to execute."

            fi

            echo
            echo "========== 11. FINAL MIGRATION STATUS =========="

            FINAL_STATUS="$(php artisan migrate:status --no-ansi)"
            echo "$FINAL_STATUS"

            if grep -q "Pending" <<< "$FINAL_STATUS"; then
              echo "ERROR: Pending migrations remain."
              exit 1
            fi

            echo
            echo "========== 12. NGINX VALIDATION =========="

            sudo nginx -t

            echo
            echo "========== 13. SERVICE VALIDATION =========="

            test "$(sudo systemctl is-active nginx)" = "active"
            test "$(sudo systemctl is-active php8.5-fpm)" = "active"

            echo "Nginx: active"
            echo "PHP-FPM: active"

            echo
            echo "========== 14. APPLICATION HEALTH CHECK =========="

            HTTP_CODE="$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 30 \
              "$APP_URL/login.html")"

            echo "Login page HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Application health check failed."
              exit 1
            fi

            echo
            echo "========== 15. FINAL DEPLOYMENT STATUS =========="

            git log -1 --oneline

            echo
            git status --short

            echo
            echo "CMMS STAGING DEPLOYMENT COMPLETED SUCCESSFULLY."
